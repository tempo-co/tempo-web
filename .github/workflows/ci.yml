name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_enable_banking_e2e:
        description: Run the protected Enable Banking sandbox test
        required: true
        default: false
        type: boolean
      api_ref:
        description: API branch or commit to build for the protected test
        required: true
        default: main
        type: string

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Run lint check
        run: npm run lint:check

      - name: Run format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-format]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate routes
        run: npm run generate-routes

      - name: Build application
        run: npm run build

  e2e-test:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout web repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Export environment variables
        run: |
          echo '${{ toJson(vars) }}' | jq -c '.' | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Setup Docker E2E environment
        run: |
          docker compose -f docker-compose.e2e.yml up -d
          npm run db:seed:e2e

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  enable-banking-e2e:
    name: Enable Banking sandbox E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_enable_banking_e2e)
    environment: enable-banking-sandbox
    concurrency:
      group: enable-banking-sandbox-e2e
      cancel-in-progress: false
    env:
      ENABLE_BANKING_E2E: 'true'
      ENABLE_BANKING_API_URL: https://api.enablebanking.com
      ENABLE_BANKING_REDIRECT_URL: http://localhost:3020/bank-connections/callback
      ENABLE_BANKING_PRIVATE_KEY_FILE: ${{ runner.temp }}/enable-banking-sandbox.key
      ENABLE_BANKING_PRIVATE_KEY_PATH: /run/secrets/enable-banking-private.key
      ENABLE_BANKING_PROVIDER_STORAGE_STATE: ${{ github.workspace }}/playwright/.auth/enable-banking-provider.json
      TEMPO_API_ENV_FILE: ${{ runner.temp }}/tempo-api-provider.env
      TEMPO_API_E2E_IMAGE: tempo-api-enable-banking
      TEMPO_API_HOST_PORT: 3020
      VITE_API_URL: http://localhost:3020
      VITE_APP_URL: http://localhost:5173
      WEB_BASE_URL: http://localhost:5173
    steps:
      - name: Checkout web repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Checkout API repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tempo-co/tempo-api
          ref: ${{ inputs.api_ref || 'main' }}
          path: tempo-api
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Write sandbox private key
        env:
          SANDBOX_PRIVATE_KEY: ${{ secrets.ENABLE_BANKING_SANDBOX_PRIVATE_KEY }}
        run: |
          set -eu
          test -n "$SANDBOX_PRIVATE_KEY"
          umask 077
          printf '%s' "$SANDBOX_PRIVATE_KEY" > "$ENABLE_BANKING_PRIVATE_KEY_FILE"
          chmod 600 "$ENABLE_BANKING_PRIVATE_KEY_FILE"
          openssl pkey -in "$ENABLE_BANKING_PRIVATE_KEY_FILE" -check -noout >/dev/null

      - name: Write provider browser state
        env:
          PROVIDER_STORAGE_STATE_B64: ${{ secrets.ENABLE_BANKING_PROVIDER_STORAGE_STATE_B64 }}
        run: |
          set -eu
          test -n "$PROVIDER_STORAGE_STATE_B64"
          mkdir -p "$(dirname "$ENABLE_BANKING_PROVIDER_STORAGE_STATE")"
          printf '%s' "$PROVIDER_STORAGE_STATE_B64" | base64 --decode > "$ENABLE_BANKING_PROVIDER_STORAGE_STATE"
          chmod 600 "$ENABLE_BANKING_PROVIDER_STORAGE_STATE"
          node -e "JSON.parse(require('fs').readFileSync(process.env.ENABLE_BANKING_PROVIDER_STORAGE_STATE, 'utf8'))"

      - name: Write API provider environment
        env:
          SANDBOX_APPLICATION_ID: ${{ secrets.ENABLE_BANKING_SANDBOX_APPLICATION_ID }}
        run: |
          set -eu
          test -n "$SANDBOX_APPLICATION_ID"
          umask 077
          printf '%s\n' \
            "ENABLE_BANKING_API_URL=$ENABLE_BANKING_API_URL" \
            "ENABLE_BANKING_APPLICATION_ID=$SANDBOX_APPLICATION_ID" \
            "ENABLE_BANKING_PRIVATE_KEY_PATH=$ENABLE_BANKING_PRIVATE_KEY_PATH" \
            "ENABLE_BANKING_REDIRECT_URL=$ENABLE_BANKING_REDIRECT_URL" \
            "WEB_BASE_URL=$WEB_BASE_URL" \
            > "$TEMPO_API_ENV_FILE"

      - name: Build matching API image
        run: docker build --tag "$TEMPO_API_E2E_IMAGE" ./tempo-api

      - name: Start isolated E2E services
        run: docker compose -p tempo-enable-banking -f docker-compose.e2e.yml up -d --wait

      - name: Seed the E2E database
        run: docker compose -p tempo-enable-banking -f docker-compose.e2e.yml exec -T api node ./dist/scripts/seed.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run the normal E2E suite with the provider test enabled
        run: npx playwright test

      - name: Remove isolated E2E services
        if: always()
        run: docker compose -p tempo-enable-banking -f docker-compose.e2e.yml down -v --remove-orphans || true

      - name: Remove provider secrets and reports
        if: always()
        run: |
          rm -f "$ENABLE_BANKING_PRIVATE_KEY_FILE" "$TEMPO_API_ENV_FILE"
          rm -f "$ENABLE_BANKING_PROVIDER_STORAGE_STATE" playwright/.auth/enable-banking-sandbox-user.json
          rm -rf playwright-report test-results

  publish-image:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [e2e-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GitHub Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.production
          push: true
          build-args: |
            VITE_APP_URL=http://127.0.0.1/tempo/
          tags: |
            ghcr.io/${{ github.repository_owner }}/tempo-web:latest
            ghcr.io/${{ github.repository_owner }}/tempo-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
