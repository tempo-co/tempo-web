server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;

    # The host's HTTPS terminator reaches this listener through the container network gateway and sends the
    # client address in X-Forwarded-For. Use that address so the API sees the client instead of the gateway.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # Inherited by every proxied location below (none sets its own proxy headers).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;

    # The app used to be served under /tempo/. Old links and bookmarks redirect to the same path at the root.
    # The redirected path must start with a plain character: a leading /, \ or control character would let
    # browsers read the target as another host.
    location ~ ^/tempo(?:/(?:([A-Za-z0-9_~-].*))?)?$ {
        return 301 /$1$is_args$args;
    }

    # Browsers refuse redirected service-worker scripts, so the worker installed under /tempo/ would keep
    # serving its cached shell forever. Replace it with one that clears its caches and unregisters.
    location = /tempo/sw.js {
        add_header Cache-Control "no-store" always;
        return 200 "self.addEventListener('install', () => self.skipWaiting());\nself.addEventListener('activate', (event) => event.waitUntil((async () => {\n  for (const key of await caches.keys()) if (key.startsWith('tempo-shell-/tempo/-')) await caches.delete(key);\n  await self.registration.unregister();\n  for (const client of await self.clients.matchAll({type: 'window'})) client.navigate(client.url);\n})()));\n";
    }

    # Bank providers may still have the former callback URL registered; proxy it rather than redirect.
    location = /tempo/bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
    }

    location = /bank-connections/callback {
        proxy_pass http://api:3000/bank-connections/callback;
    }

    location = /api {
        proxy_pass http://api:3000/;
    }

    location /api/ {
        proxy_pass http://api:3000/;
    }

    location / {
        include /etc/nginx/snippets/tempo-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
